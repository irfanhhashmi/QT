    d="M 136 42 A 80 80 0 0 1 162 82" 
    stroke="#206B6B" 
    stroke-width="9.5" 
    stroke-linecap="round" 
    fill="none"
  />
  <!-- Middle Wave (Vibrant Teal) -->
  <path 
    d="M 130 54 A 62 62 0 0 1 149 85" 
    stroke="#1AA397" 
